<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>聊天机器人</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .user { color: blue; text-align: right; margin: 5px; }
        .bot { color: green; text-align: left; margin: 5px; }
        input[type="text"] { width: 80%; padding: 5px; }
        button { padding: 5px 10px; }
    </style>
</head>
<body>
    <h2>我的聊天机器人</h2>
    <div id="chat-box"></div>
    <input type="text" id="msg-input" placeholder="输入消息...">
    <button onclick="sendMessage()">发送</button>

    <script>
        const sessionId = "web_user_1";
        const chatBox = document.getElementById('chat-box');

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value;
            if (!text) return;

            // 显示用户消息
            chatBox.innerHTML += `<div class="user">你: ${text}</div>`;
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: text })
                });
                const data = await response.json();
                // 显示机器人回复
                chatBox.innerHTML += `<div class="bot">AI: ${data.reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {
                chatBox.innerHTML += `<div class="bot">出错啦!</div>`;
            }
        }
    </script>
</body>
</html>
